<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douglas Campbell</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9;
    --fg: #1c1c1a;
    --muted: #6b6b66;
    --accent: #8a5a3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --fg: #ececea;
      --muted: #9a9a94;
      --accent: #d3a17c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }
  .tagline {
    color: var(--accent);
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0 0 1.75rem;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 0.5rem;
  }
  .marker {
    display: inline-block;
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 0.5rem;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<main>
  <p class="tagline"><span class="marker"></span>Watch this space</p>
  <h1>Douglas Campbell</h1>
  <p>This page is under construction. Something new is on the way.</p>
</main>
</body>
</html>
